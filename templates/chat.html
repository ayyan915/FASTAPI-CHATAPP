<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — {{ friend.name_tag }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f4f5;
    --card: #ffffff;
    --ink: #101113;
    --muted: #75757b;
    --border: #e7e7ea;
    --bubble-them: #f1f1f2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; }
  body {
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    width: 100%;
    max-width: 720px;
    height: min(680px, 88vh);
    background: var(--card);
    border-radius: 22px;
    box-shadow: 0 20px 45px rgba(16, 17, 19, 0.08), 0 2px 6px rgba(16, 17, 19, 0.04);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header {
    padding: 16px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    gap: 10px;
  }
  .header .left { display: flex; align-items: center; min-width: 0; gap: 12px; }
  .back {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #f2f2f3;
    text-decoration: none;
    color: var(--ink);
    font-size: 16px;
    flex-shrink: 0;
    transition: background 0.12s;
  }
  .back:hover { background: var(--border); }
  .header strong {
    font-weight: 700;
    font-size: 16px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .me-tag { font-size: 13px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }

  .messages {
    flex: 1;
    padding: 18px 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 72%;
    padding: 11px 15px;
    font-size: 15px;
    line-height: 1.4;
    border-radius: 18px;
  }
  .bubble.me {
    align-self: flex-end;
    background: var(--ink);
    color: #ffffff;
    border-bottom-right-radius: 4px;
  }
  .bubble.them {
    align-self: flex-start;
    background: var(--bubble-them);
    color: var(--ink);
    border-bottom-left-radius: 4px;
  }

  .composer {
    padding: 14px 18px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  .composer input {
    flex: 1;
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: 999px;
    background: #fbfbfc;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    outline: none;
    min-width: 0;
    transition: border-color 0.15s, background 0.15s;
  }
  .composer input:focus { border-color: var(--ink); background: #ffffff; }
  .composer input::placeholder { color: #b3b3ba; }
  .composer button {
    padding: 0 22px;
    border: none;
    border-radius: 999px;
    background: var(--ink);
    color: #ffffff;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.12s, transform 0.08s;
  }
  .composer button:hover { background: #2a2a2d; }
  .composer button:active { transform: scale(0.97); }

  @media (max-width: 460px) {
    .card { height: 92vh; border-radius: 20px; }
    .header { padding: 12px 16px; }
    .messages { padding: 14px 16px; }
    .bubble { max-width: 85%; font-size: 14px; }
    .composer { padding: 10px 14px; }
    .composer button { padding: 0 16px; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="left">
        <a class="back" href="/home/friends" title="Back">&larr;</a>
        <strong>{{ friend.name_tag }}</strong>
        <span id="user_status"></span>
      </div>
      <div class="me-tag">You: {{ current_user.name_tag }}</div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="composer">
      <input id="messageInput" placeholder="Write a message...">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const friendTag = "{{ friend.name_tag }}";
    const meTag = "{{ current_user.name_tag }}";
    const messagesEl = document.getElementById('messages');
    const user_status = document.getElementById('user_status')

    function appendMessage(sender, text){
      const div = document.createElement('div');
      div.className = 'bubble ' + (sender === meTag ? 'me' : 'them');
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(scheme + '://' + location.host + '/wss');

    ws.addEventListener('open', () => {
      ws.send(JSON.stringify({ type: 'chat_history', with: friendTag }));
      ws.send(JSON.stringify({type: "user_status", username: friendTag}));
    });

    ws.addEventListener('message', (ev) => {
      try{
        const data = JSON.parse(ev.data);
        if(data.type === 'chat_history'){
          data.messages.forEach(m => appendMessage(m.sender, m.content));
        } else if(data.type === 'message'){
          appendMessage(data.sender, data.content);
        }
        else if(data.type === 'status', data.status === 'online', data.friend_name === friendTag){
          user_status.innerText = data.status;
        }
        else if(data.type === 'status', data.status === 'offline'){
          if (friendTag === data.friend_name){
            user_status.innerText = "";
          }
        }
      }catch(e){ console.error(e) }
    });

    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('messageInput').addEventListener('keydown', (e)=>{ if(e.key === 'Enter') sendMessage() });

    function sendMessage(){
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if(!text) return;
      ws.send(JSON.stringify({ type: 'message', receiver: friendTag, content: text }));
      appendMessage(meTag, text);
      input.value = '';
    }
  </script>
</body>
</html>
