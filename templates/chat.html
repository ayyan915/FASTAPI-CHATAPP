<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — {{ friend.name_tag }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f4f5;
    --card: #ffffff;
    --ink: #101113;
    --muted: #75757b;
    --border: #e7e7ea;
    --bubble-them: #f1f1f2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; }
  body {
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    width: 100%;
    max-width: 720px;
    height: min(680px, 88vh);
    background: var(--card);
    border-radius: 22px;
    box-shadow: 0 20px 45px rgba(16, 17, 19, 0.08), 0 2px 6px rgba(16, 17, 19, 0.04);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header {
    padding: 16px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    gap: 10px;
  }
  .header .left { display: flex; align-items: center; min-width: 0; gap: 12px; }
  .back {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #f2f2f3;
    text-decoration: none;
    color: var(--ink);
    font-size: 16px;
    flex-shrink: 0;
    transition: background 0.12s;
  }
  .back:hover { background: var(--border); }
  .header strong {
    font-weight: 700;
    font-size: 16px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .me-tag { font-size: 13px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }

  .messages {
    flex: 1;
    padding: 18px 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 72%;
    padding: 11px 15px;
    font-size: 15px;
    line-height: 1.4;
    border-radius: 18px;
  }
  .bubble.me {
    align-self: flex-end;
    background: var(--ink);
    color: #ffffff;
    border-bottom-right-radius: 4px;
  }
  .bubble.them {
    align-self: flex-start;
    background: var(--bubble-them);
    color: var(--ink);
    border-bottom-left-radius: 4px;
  }

  .composer {
    padding: 14px 18px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  .composer input {
    flex: 1;
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: 999px;
    background: #fbfbfc;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    outline: none;
    min-width: 0;
    transition: border-color 0.15s, background 0.15s;
  }
  .composer input:focus { border-color: var(--ink); background: #ffffff; }
  .composer input::placeholder { color: #b3b3ba; }
  .composer button {
    padding: 0 22px;
    border: none;
    border-radius: 999px;
    background: var(--ink);
    color: #ffffff;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.12s, transform 0.08s;
  }
  .composer button:hover { background: #2a2a2d; }
  .composer button:active { transform: scale(0.97); }

  @media (max-width: 460px) {
    .card { height: 92vh; border-radius: 20px; }
    .header { padding: 12px 16px; }
    .messages { padding: 14px 16px; }
    .bubble { max-width: 85%; font-size: 14px; }
    .composer { padding: 10px 14px; }
    .composer button { padding: 0 16px; }
  }

  .header-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: #f2f2f3;
    color: var(--ink);
    font-size: 15px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.12s;
  }
  .icon-btn:hover { background: var(--border); }

  /* Full-screen call overlay: shows once a call starts (outgoing or accepted) */
  .call-overlay {
    position: fixed;
    inset: 0;
    background: #101113;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .call-overlay.active { display: flex; }
  .call-avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: #2a2a2d;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    font-weight: 700;
    margin-bottom: 20px;
  }
  .call-name {
    color: #fff;
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .call-status {
    color: rgba(255,255,255,0.65);
    font-size: 14px;
    font-weight: 500;
  }
  .call-controls {
    position: absolute;
    bottom: 40px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 18px;
  }
  .call-controls button {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 20px;
  }
  #muteBtn { background: rgba(255,255,255,0.15); color: #fff; }
  #muteBtn.muted { background: #fff; color: var(--ink); }
  #endCallBtn { background: #e6413f; color: #fff; }

  /* Incoming call popup */
  .incoming-call {
    position: fixed;
    inset: 0;
    background: rgba(16,17,19,0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1100;
  }
  .incoming-call.active { display: flex; }
  .incoming-call-card {
    background: #fff;
    border-radius: 20px;
    padding: 28px 30px;
    text-align: center;
    min-width: 240px;
    box-shadow: 0 20px 45px rgba(16,17,19,0.2);
  }
  .incoming-call-card p { margin: 0 0 20px; font-size: 16px; font-weight: 700; }
  .incoming-call-actions { display: flex; gap: 16px; justify-content: center; }
  .incoming-call-actions button {
    width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer; font-size: 19px;
  }
  #acceptBtn { background: #2fae5c; color: #fff; }
  #declineBtn { background: #e6413f; color: #fff; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="left">
        <a class="back" href="/home/friends" title="Back">&larr;</a>
        <strong>{{ friend.name_tag }}</strong>
        <span id="user_status"></span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="callBtn" title="Voice call">&#128222;</button>
        <div class="me-tag">You: {{ current_user.name_tag }}</div>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="composer">
      <input id="messageInput" placeholder="Write a message...">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <div class="call-overlay" id="callOverlay">
    <div class="call-avatar" id="callAvatar">?</div>
    <div class="call-name" id="callName"></div>
    <div class="call-status" id="callStatus">Calling...</div>
    <audio id="remoteAudio" autoplay></audio>
    <div class="call-controls">
      <button id="muteBtn" title="Mute">&#127908;</button>
      <button id="endCallBtn" title="End call">&#10006;</button>
    </div>
  </div>

  <div class="incoming-call" id="incomingCall">
    <div class="incoming-call-card">
      <p id="incomingCallText">Incoming call</p>
      <div class="incoming-call-actions">
        <button id="declineBtn" title="Decline">&#10006;</button>
        <button id="acceptBtn" title="Accept">&#128222;</button>
      </div>
    </div>
  </div>

  <script>
    // Use JSON encoding so names containing quotes/apostrophes do not break JavaScript.
    const friendTag = {{ friend.name_tag|tojson }};
    const meTag = {{ current_user.name_tag|tojson }};
    const messagesEl = document.getElementById('messages');
    const user_status = document.getElementById('user_status');

    function appendMessage(sender, text) {
      const div = document.createElement('div');
      div.className = 'bubble ' + (sender === meTag ? 'me' : 'them');
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // ------------------------------------------------------------
    // WebRTC voice-call feature
    // ------------------------------------------------------------
    const ICE_SERVERS = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        {
          urls: 'turn:openrelay.metered.ca:80',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        },
        {
          urls: 'turn:openrelay.metered.ca:443',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        },
        {
          urls: 'turn:openrelay.metered.ca:443?transport=tcp',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        }
      ]
    };

    let pc = null;
    let localStream = null;
    let callPartner = null;
    let pendingIncomingOffer = null;
    let pendingIceCandidates = [];

    const callOverlay = document.getElementById('callOverlay');
    const callAvatar = document.getElementById('callAvatar');
    const callName = document.getElementById('callName');
    const callStatus = document.getElementById('callStatus');
    const remoteAudio = document.getElementById('remoteAudio');
    const incomingCall = document.getElementById('incomingCall');
    const incomingCallText = document.getElementById('incomingCallText');
    const muteBtn = document.getElementById('muteBtn');

    function signal(message) {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        console.error('WebSocket is not connected:', message);
        alert('Connection to server is not ready. Please refresh the page.');
        return false;
      }
      ws.send(JSON.stringify(message));
      return true;
    }

    function createPeerConnection() {
      if (pc) return pc;

      pc = new RTCPeerConnection(ICE_SERVERS);
      pendingIceCandidates = [];

      pc.onicecandidate = (event) => {
        if (event.candidate && callPartner) {
          signal({
            type: 'call-ice-candidate',
            target: callPartner,
            candidate: event.candidate
          });
        }
      };

      pc.ontrack = (event) => {
        if (event.streams && event.streams[0]) {
          remoteAudio.srcObject = event.streams[0];
          remoteAudio.play().catch(() => {
            // Browser may block autoplay until a user gesture.
          });
        }
        callStatus.textContent = 'Connected';
      };

      pc.onconnectionstatechange = () => {
        if (!pc) return;

        if (pc.connectionState === 'connecting') {
          callStatus.textContent = 'Connecting...';
        } else if (pc.connectionState === 'connected') {
          callStatus.textContent = 'Connected';
        } else if (pc.connectionState === 'disconnected') {
          callStatus.textContent = 'Disconnected';
          endCall(false);
        } else if (pc.connectionState === 'failed') {
          callStatus.textContent = 'Connection failed';
          endCall(false);
          alert('Call connection failed. Both users may need a stable internet connection.');
        } else if (pc.connectionState === 'closed') {
          endCall(false);
        }
      };

      pc.oniceconnectionstatechange = () => {
        if (!pc) return;
        if (pc.iceConnectionState === 'checking') {
          callStatus.textContent = 'Connecting...';
        }
      };

      return pc;
    }

    async function getMicrophone() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('getUserMedia is not supported in this browser/context.');
      }

      return navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        },
        video: false
      });
    }

    async function addLocalTracks() {
      if (!localStream) {
        localStream = await getMicrophone();
      }

      const peer = createPeerConnection();
      const existingTrackIds = new Set(
        peer.getSenders().map(sender => sender.track && sender.track.id).filter(Boolean)
      );

      localStream.getTracks().forEach(track => {
        if (!existingTrackIds.has(track.id)) {
          peer.addTrack(track, localStream);
        }
      });
    }

    async function flushPendingIceCandidates() {
      if (!pc || !pc.remoteDescription) return;

      const candidates = pendingIceCandidates;
      pendingIceCandidates = [];

      for (const candidate of candidates) {
        try {
          await pc.addIceCandidate(new RTCIceCandidate(candidate));
        } catch (err) {
          console.error('Failed to add queued ICE candidate:', err);
        }
      }
    }

    async function startCall() {
      if (pc || pendingIncomingOffer) return;

      callPartner = friendTag;
      callAvatar.textContent = friendTag.slice(0, 1).toUpperCase();
      callName.textContent = friendTag;
      callStatus.textContent = 'Calling...';
      callOverlay.classList.add('active');

      try {
        await addLocalTracks();

        const offer = await pc.createOffer({
          offerToReceiveAudio: true
        });

        await pc.setLocalDescription(offer);

        if (!signal({
          type: 'call-offer',
          target: callPartner,
          offer: pc.localDescription
        })) {
          endCall(false);
        }
      } catch (err) {
        console.error('Could not start call:', err);
        endCall(false);

        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          alert('Microphone permission was denied. Allow microphone access and try again.');
        } else if (err.name === 'NotFoundError') {
          alert('No microphone was found on this device.');
        } else {
          alert('Could not start the call: ' + err.message);
        }
      }
    }

    async function acceptCall() {
      if (!pendingIncomingOffer) return;

      const incoming = pendingIncomingOffer;
      pendingIncomingOffer = null;
      incomingCall.classList.remove('active');

      callPartner = incoming.from;
      callAvatar.textContent = callPartner.slice(0, 1).toUpperCase();
      callName.textContent = callPartner;
      callStatus.textContent = 'Connecting...';
      callOverlay.classList.add('active');

      try {
        await addLocalTracks();

        await pc.setRemoteDescription(new RTCSessionDescription(incoming.offer));
        await flushPendingIceCandidates();

        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        if (!signal({
          type: 'call-answer',
          target: callPartner,
          answer: pc.localDescription
        })) {
          endCall(false);
        }
      } catch (err) {
        console.error('Could not accept call:', err);
        endCall(true);
        alert('Could not accept the call: ' + err.message);
      }
    }

    function declineCall() {
      if (pendingIncomingOffer) {
        signal({
          type: 'call-end',
          target: pendingIncomingOffer.from
        });
      }

      pendingIncomingOffer = null;
      incomingCall.classList.remove('active');
    }

    function endCall(notifyPartner = true) {
      const partner = callPartner;

      if (notifyPartner && partner) {
        signal({
          type: 'call-end',
          target: partner
        });
      }

      if (pc) {
        pc.onicecandidate = null;
        pc.ontrack = null;
        pc.onconnectionstatechange = null;
        pc.close();
        pc = null;
      }

      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }

      pendingIceCandidates = [];
      remoteAudio.srcObject = null;
      callOverlay.classList.remove('active');
      callPartner = null;
      muteBtn.classList.remove('muted');
      muteBtn.innerHTML = '&#127908;';
      callStatus.textContent = 'Calling...';
    }

    function toggleMute() {
      if (!localStream) return;

      const audioTrack = localStream.getAudioTracks()[0];
      if (!audioTrack) return;

      audioTrack.enabled = !audioTrack.enabled;
      muteBtn.classList.toggle('muted', !audioTrack.enabled);
      muteBtn.innerHTML = audioTrack.enabled ? '&#127908;' : '&#128263;';
    }

    document.getElementById('callBtn').addEventListener('click', startCall);
    document.getElementById('endCallBtn').addEventListener('click', () => endCall(true));
    document.getElementById('acceptBtn').addEventListener('click', acceptCall);
    document.getElementById('declineBtn').addEventListener('click', declineCall);
    muteBtn.addEventListener('click', toggleMute);

    // ------------------------------------------------------------
    // WebSocket signaling + chat
    // ------------------------------------------------------------
    const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(scheme + '://' + location.host + '/wss');

    ws.addEventListener('open', () => {
      signal({ type: 'chat_history', with: friendTag });
      signal({ type: 'user_status', username: friendTag });
    });

    ws.addEventListener('close', () => {
      if (pc) {
        endCall(false);
      }
    });

    ws.addEventListener('error', (err) => {
      console.error('WebSocket error:', err);
    });

    ws.addEventListener('message', async (ev) => {
      try {
        const data = JSON.parse(ev.data);

        if (data.type === 'chat_history') {
          data.messages.forEach(m => appendMessage(m.sender, m.content));

        } else if (data.type === 'message') {
          appendMessage(data.sender, data.content);

        } else if (
          data.type === 'status' &&
          data.status === 'online' &&
          data.friend_name === friendTag
        ) {
          user_status.innerText = 'online';

        } else if (
          data.type === 'status' &&
          data.status === 'offline' &&
          data.friend_name === friendTag
        ) {
          user_status.innerText = '';

        // Someone is calling us.
        } else if (data.type === 'call-offer') {
          if (pc || pendingIncomingOffer) {
            signal({ type: 'call-end', target: data.from });
            return;
          }

          pendingIncomingOffer = {
            from: data.from,
            offer: data.offer
          };
          incomingCallText.textContent = data.from + ' is calling...';
          incomingCall.classList.add('active');

        // Our call was accepted.
        } else if (data.type === 'call-answer') {
          if (!pc) return;

          await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
          await flushPendingIceCandidates();

        // Network candidates from the other side.
        } else if (data.type === 'call-ice-candidate') {
          if (!data.candidate) return;

          if (pc && pc.remoteDescription) {
            try {
              await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            } catch (err) {
              console.error('Failed to add ICE candidate:', err);
            }
          } else {
            pendingIceCandidates.push(data.candidate);
          }

        // Other side hung up / declined.
        } else if (data.type === 'call-end') {
          endCall(false);
          incomingCall.classList.remove('active');
          pendingIncomingOffer = null;

        // We called someone who is offline.
        } else if (data.type === 'call-status' && data.status === 'offline') {
          alert(data.target + ' is offline right now.');
          endCall(false);
        }
      } catch (e) {
        console.error('WebSocket message error:', e);
      }
    });

    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('messageInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const messageText = input.value.trim();
      if (!messageText) return;

      if (!signal({
        type: 'message',
        receiver: friendTag,
        content: messageText
      })) {
        return;
      }

      appendMessage(meTag, messageText);
      input.value = '';
    }
  </script>
</body>
</html>
