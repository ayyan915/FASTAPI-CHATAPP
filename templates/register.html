<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f4f5;
    --card: #ffffff;
    --ink: #101113;
    --muted: #75757b;
    --border: #e7e7ea;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; }
  body {
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 20px 45px rgba(16, 17, 19, 0.08), 0 2px 6px rgba(16, 17, 19, 0.04);
    padding: clamp(32px, 6vw, 44px) clamp(28px, 6vw, 38px);
  }

  h1 {
    font-weight: 800;
    font-size: clamp(24px, 6vw, 28px);
    letter-spacing: -0.02em;
    margin: 0 0 6px;
    color: var(--ink);
  }

  p.subtitle {
    margin: 0 0 28px;
    font-size: 15px;
    color: var(--muted);
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 7px;
  }
  input {
    width: 100%;
    padding: 13px 15px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: #fbfbfc;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  input:focus { border-color: var(--ink); background: #ffffff; }
  input::placeholder { color: #b3b3ba; }

  button {
    width: 100%;
    margin-top: 8px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: var(--ink);
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.15s, transform 0.08s;
  }
  button:hover { background: #2a2a2d; }
  button:active { transform: scale(0.99); }

  .error-box {
    border-radius: 10px;
    background: #f1f1f2;
    color: var(--ink);
    padding: 11px 14px;
    font-size: 14px;
    margin-bottom: 20px;
    border: 1.5px solid var(--border);
  }

  .footer-link {
    text-align: center;
    margin-top: 24px;
    font-size: 14px;
    color: var(--muted);
  }
  .footer-link a { color: var(--ink); font-weight: 600; text-decoration: none; }
  .footer-link a:hover { text-decoration: underline; }

  @media (max-width: 420px) {
    .card { padding: 30px 22px; border-radius: 18px; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Create your account</h1>
    <p class="subtitle">Join the chat and start talking</p>

    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <form action="/register" method="post">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" minlength="3" maxlength="50" required placeholder="e.g. ayyan123" autocomplete="username">
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email">
      </div>

      <div class="field">
        <label for="name_tag">Display name</label>
        <input type="text" id="name_tag" name="name_tag" pattern="^@.+" required placeholder="e.g. @ayyan123">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="6" required placeholder="At least 6 characters" autocomplete="new-password">
      </div>

      <button type="submit">Create account</button>
    </form>

    <div class="footer-link">
      Already have an account? <a href="/">Login</a>
    </div>
  </div>
</body>
</html>
